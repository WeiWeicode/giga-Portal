# 員工入口網 Pipeline(Runner:主機 2 WSL shell executor,tag windows-runner;與 Gateway 同一台主機)
#   check        所有分支:前端、portal-api 型別檢查與單元測試
#   deploy-test  develop:建置 SPA 並發佈到 Gateway 的 gw_www(Nginx /);建置並更新 portal-api(加入 Gateway 網路)
#                portal-api 需主機已有 PORTAL_SECRETS_DIR 機密與 portal.env 變數(deploy/host2-set-api-secrets.sh 產生)
#   rbac-test    develop:以已部署的 Gateway 映像套用 deploy/gateway-rbac.yaml(權限代碼、employee 角色)
# @giganexus/web-kit 取自公司 GitLab npm Registry:Token(群組 Deploy Token,read_package_registry)
#   放在主機機密檔 ${NPM_TOKEN_FILE},以 GITLAB_NPM_TOKEN 提供給 npm 與 Docker 建置 secret(同 GigaItApp)
stages: [check, deploy-test, rbac-test]

variables:
  GATEWAY_DIR: /srv/giganexus/shared/giga-api-gateway-bff
  PORTAL_ENV_FILE: /srv/giganexus/deploy/portal.env
  GW_TEST_ENV_FILE: /srv/giganexus/deploy/test.env
  NPM_TOKEN_FILE: /srv/giganexus/deploy/secrets/gitlab_npm_token
  PORTAL_SECRETS_DIR: /srv/giganexus/portal-secrets

.runner: &runner
  tags: [windows-runner]

check:frontend:
  <<: *runner
  stage: check
  script:
    - export GITLAB_NPM_TOKEN="$(cat "$NPM_TOKEN_FILE")"
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm test

check:backend:
  <<: *runner
  stage: check
  script:
    - export GITLAB_NPM_TOKEN="$(cat "$NPM_TOKEN_FILE")"
    - cd backend
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm test
    - npm run db:check-2012

deploy-test:
  <<: *runner
  stage: deploy-test
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  environment: { name: test, url: https://10.10.130.124/ }
  script:
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA RELEASE_SHA=$CI_COMMIT_SHORT_SHA COMPOSE_ENV_FILES="$PORTAL_ENV_FILE"
    - export GITLAB_NPM_TOKEN="$(cat "$NPM_TOKEN_FILE")"
    - P="docker compose -f deploy/docker-compose.yml --profile publish"
    # --pull:主機上的 node:22-alpine 可能被其他專案覆寫(同 GigaItApp 2026-10-02)
    - $P build --pull spa-portal
    - $P run --rm spa-portal
    - curl -skf https://127.0.0.1/login | grep -o '<title>[^<]*'

deploy-api-test:
  <<: *runner
  stage: deploy-test
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  environment: { name: test-api }
  script:
    - for f in portal_db_password google_maps_api_key; do test -f "$PORTAL_SECRETS_DIR/$f" || { echo "缺少 portal-api 機密 $f(先在主機 2 執行 deploy/host2-set-api-secrets.sh)" >&2; exit 1; }; done
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA RELEASE_SHA=$CI_COMMIT_SHORT_SHA COMPOSE_ENV_FILES="$PORTAL_ENV_FILE"
    - export GITLAB_NPM_TOKEN="$(cat "$NPM_TOKEN_FILE")"
    - C="docker compose -f deploy/docker-compose.yml --profile api"
    # --pull:主機上的 node:22-alpine 可能被其他專案覆寫(同 GigaItApp 2026-10-02)
    - $C build --pull portal-api
    - $C up -d --wait portal-api
    # 冒煙測試:SQL 與各舊庫來源可讀;無內部 Token → 401
    - $C exec -T portal-api wget -qO- http://127.0.0.1:51271/readyz
    - '$C exec -T portal-api node -e "fetch(\"http://127.0.0.1:51271/v1/me\").then((r) => process.exit(r.status === 401 ? 0 : 1))" && echo "OK   /v1/me 無內部 Token → 401"'

rbac-test:
  <<: *runner
  stage: rbac-test
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # 與測試區 Gateway 相同的映像(Gateway deploy-test 記錄)
    - export IMAGE_TAG="$(cat "$(dirname "$GATEWAY_DIR")/gateway-image-tag")" REGISTRY=10.10.130.123:5050/giganexus/giga-api-gateway-bff
    - sh deploy/apply-gateway-rbac.sh test "$GW_TEST_ENV_FILE"
