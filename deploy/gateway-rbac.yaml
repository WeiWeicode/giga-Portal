# 測試區 / 正式區 Gateway 的員工入口網權限(Gateway CLI `apply` 格式;docs/TEST-DEPLOY-RUNBOOK 見 Gateway repo)
#
#   sh deploy/apply-gateway-rbac.sh test <Gateway 區域 env 檔>      # CI rbac-test 於 develop 自動執行
#
# 結構同 GigaItApp deploy/gateway-rbac.yaml(docs/FRAMEWORK-PLAN.md §3、附錄 A):
#   ① 選單目錄 portal.group.*(kind group)→ 功能頁(kind menu,一頁一碼)→ Tab(kind tab)→ 按鈕(kind button,includes = 呼叫的 API)
#      本檔只負責首次登記:已存在的權限不覆寫名稱、上層與排序,之後在 GigaItApp「系統管理 › 選單管理」調整
#      (2026-10-12 前登記的舊代碼上層仍是 portal.app.access,需在選單管理移到對應目錄;入口網側欄不受影響,會依前端預設歸類)
#      功能頁與 Tab 的代碼必須與 frontend/src/router.ts 一致(Tab = 選單代碼去掉 .read + key)
#   ② 角色:permissions 會整組取代;成員(AD 群組 / 指派規則 / 個別指派)由 IT 在 GigaItApp 設定,此處不寫 adGroups / companies
#      IT 管理系統管理員(it-admin)可查看全部入口網選單與 Tab,登記在 GigaItApp 的 gateway-rbac.yaml(本檔需先套用)
#   新增的排序值與前一頁相同時,入口網依前端路由順序排列(composables/menu.ts)
# 測試區與正式區設定不互通(Gateway PRD Q3),兩區各自套用。
# BPM 簽核 API(bpm.approval.*)由 BPM 的 OpenAPI 登記後,再於選單管理綁定到「待我簽核」「BPM 簽核資訊」(PRD Q8)。
permissions:
  # 應用(kind=app,Gateway PRD §8.3.3);it.app.access 與 GigaItApp 相同(兩邊需一致)
  - { code: portal.app.access, name: 員工入口網使用權限, kind: app, sort: 10 }
  - { code: it.app.access, name: IT 管理系統使用權限, kind: app, sort: 20 }
