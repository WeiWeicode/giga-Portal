# 測試區 / 正式區 Gateway 的員工入口網權限(Gateway CLI `apply` 格式;docs/TEST-DEPLOY-RUNBOOK 見 Gateway repo)
#
# 需要 AD 群組的角色由 IT 依公司 GN-* 群組填入 DN(Gateway P-08)。
# 測試區與正式區設定不互通(Gateway PRD Q3),兩區各自套用:
#   sh deploy/apply-gateway-rbac.sh test <主機受保護目錄>/test.env
# 權限分類 kind / parent / sort(Gateway PRD §8.3.2,2026-10-01 起支援)依 frontend/src/router.ts 的選單順序,供 GigaItApp 以樹狀設定。
# 暫時做法:portal-api(x-permissions 自動註冊)上線後,權限改由 portal-api 宣告,角色與指派改由 IT 在 GigaItApp 設定(PRD §5.2、§9)。
# 權限代碼以 PRD §6.5 為準。
# 注意:Gateway CLI 沒有個別指派角色的指令,需要 AD 群組(adGroups)或公司(companies)才會有成員;
#       套用會遞增所有使用者的權限版本(已登入者下一次呼叫 API 時由 web-kit 自動換發,不需重新登入)。
permissions:
  # 應用(kind=app,Gateway PRD §8.3.3)
  - { code: portal.app.access, name: 員工入口網使用權限, kind: app, sort: 10 }
  - { code: it.app.access, name: IT 管理系統使用權限, kind: app, sort: 20 }
  # 選單 / Tab / 按鈕
  - { code: portal.home.read, name: 入口網首頁, kind: menu, parent: portal.app.access, sort: 10 }
  - { code: portal.profile.read, name: 個人資料, kind: menu, parent: portal.app.access, sort: 20 }
  - { code: portal.profile.edit, name: 編輯緊急聯絡人, kind: button, parent: portal.profile.read, sort: 10 }
  - { code: portal.leave.read, name: 我的假期, kind: menu, parent: portal.app.access, sort: 30 }
  - { code: portal.leave-history.read, name: 請假紀錄, kind: tab, parent: portal.leave.read, sort: 10 }
  - { code: portal.leave.apply, name: 請假申請, kind: button, parent: portal.leave.read, sort: 20 }
  - { code: portal.attendance.read, name: 出勤紀錄, kind: menu, parent: portal.app.access, sort: 40 }
  - { code: portal.attendance.punch, name: 線上打卡, kind: button, parent: portal.attendance.read, sort: 10 }
  - { code: portal.form.read, name: 表單下載, kind: menu, parent: portal.app.access, sort: 60 }
  - { code: portal.resource.read, name: 行政資源, kind: menu, parent: portal.app.access, sort: 70 }
  - { code: portal.resource.edit, name: 維護行政資源, kind: menu, parent: portal.resource.read, sort: 10 }
  - { code: portal.onboarding.read, name: 新人導覽, kind: menu, parent: portal.app.access, sort: 80 }
  - { code: portal.onboarding.edit, name: 維護新人導覽, kind: button, parent: portal.onboarding.read, sort: 10 }
  - { code: portal.directory.read, name: 分機表、聯絡窗口, kind: menu, parent: portal.app.access, sort: 90 }
  - { code: portal.gui-number.read, name: 集團統編資訊, kind: menu, parent: portal.app.access, sort: 100 }
  - { code: portal.news.read, name: 公告, kind: menu, parent: portal.app.access, sort: 110 }
  - { code: portal.news.publish, name: 發布公告, kind: button, parent: portal.news.read, sort: 10 }
  - { code: portal.calendar.read, name: 行事曆, kind: menu, parent: portal.app.access, sort: 120 }
  - { code: portal.links.read, name: 集團系統, kind: menu, parent: portal.app.access, sort: 130 }
  - { code: portal.talk.read, name: 3691 全民開講, kind: menu, parent: portal.app.access, sort: 140 }
  # 個人資訊細分(PRD §6.5 v0.1.3):薪資與個資分開授權
  - { code: portal.salary.read, name: 薪資獎金 / 年度所得 / 薪資異動, kind: menu, parent: portal.app.access, sort: 21 }
  - { code: portal.attendance-abnormal.read, name: 出勤異常 / 異常回報, kind: menu, parent: portal.app.access, sort: 41 }
  - { code: portal.release-mail.read, name: 郵件審核資訊, kind: menu, parent: portal.app.access, sort: 42 }
  - { code: portal.asset.read, name: 個人資產明細, kind: menu, parent: portal.app.access, sort: 43 }
  - { code: portal.course.read, name: 年度必上課程, kind: menu, parent: portal.app.access, sort: 44 }
  - { code: portal.note.read, name: 個人提醒, kind: menu, parent: portal.app.access, sort: 45 }
  - { code: portal.survey.read, name: 問卷調查, kind: menu, parent: portal.app.access, sort: 75 }
  # 主管專區(資料層級由後端依部門含下層過濾)
  - { code: portal.mgr.rights.read, name: 主管權益, kind: menu, parent: portal.app.access, sort: 200 }
  - { code: portal.mgr.shift.read, name: 班表上傳, kind: menu, parent: portal.app.access, sort: 201 }
  - { code: portal.mgr.boss-trace.read, name: 理級以上出勤時數追蹤, kind: menu, parent: portal.app.access, sort: 202 }
  - { code: portal.mgr.attendance.read, name: 員工出勤狀況, kind: menu, parent: portal.app.access, sort: 203 }
  - { code: portal.mgr.leave-balance.read, name: 員工特補休剩餘時數, kind: menu, parent: portal.app.access, sort: 204 }
  - { code: portal.mgr.promotion.read, name: 晉升地圖, kind: menu, parent: portal.app.access, sort: 205 }
  - { code: portal.mgr.training.read, name: 年度教育訓練計畫, kind: menu, parent: portal.app.access, sort: 206 }
  - { code: portal.mgr.safety-course.read, name: 部門工安課程達成率, kind: menu, parent: portal.app.access, sort: 207 }
  - { code: portal.mgr.property.read, name: 部門資產明細, kind: menu, parent: portal.app.access, sort: 208 }
  - { code: portal.mgr.budget.read, name: 部門預算, kind: menu, parent: portal.app.access, sort: 209 }
  - { code: portal.mgr.budget-apply.read, name: 部門預算編列, kind: menu, parent: portal.app.access, sort: 210 }
  # ESH 證照管理(化學品清單全員可讀)
  - { code: portal.esh.license.read, name: 證照管理, kind: menu, parent: portal.app.access, sort: 300 }
  - { code: portal.esh.item.read, name: 證照項目設定, kind: menu, parent: portal.app.access, sort: 301 }
  - { code: portal.esh.need.read, name: 證照需求, kind: menu, parent: portal.app.access, sort: 302 }
  - { code: portal.esh.personal.read, name: 證照人員設定, kind: menu, parent: portal.app.access, sort: 303 }
  - { code: portal.esh.manager.read, name: 證照管理員, kind: menu, parent: portal.app.access, sort: 304 }
  - { code: portal.esh.chemical.read, name: 危害性化學品清單, kind: menu, parent: portal.app.access, sort: 305 }
  # BPM 簽核:BPM 提供 API 後改由 BPM 的 OpenAPI 宣告(PRD Q8)
  - { code: bpm.approval.read, name: 待我簽核, kind: menu, parent: portal.app.access, sort: 50 }
  - { code: bpm.approval.approve, name: 簽核核准, kind: button, parent: bpm.approval.read, sort: 10 }
  - { code: bpm.approval.reject, name: 簽核退回, kind: button, parent: bpm.approval.read, sort: 20 }

roles:
  - code: employee
    name: 員工
    permissions:
      - portal.app.access
      - portal.home.read
      - portal.profile.read
      - portal.profile.edit
      - portal.salary.read
      - portal.leave.read
      - portal.leave-history.read
      - portal.leave.apply
      - portal.attendance.read
      - portal.attendance.punch
      - portal.attendance-abnormal.read
      - portal.release-mail.read
      - portal.asset.read
      - portal.course.read
      - portal.note.read
      - portal.form.read
      - portal.resource.read
      - portal.survey.read
      - portal.onboarding.read
      - portal.directory.read
      - portal.gui-number.read
      - portal.news.read
      - portal.calendar.read
      - portal.links.read
      - portal.talk.read
      - portal.esh.chemical.read
  # 主管:Gateway 指派規則(G1)依職級設定成員,不再用舊系統「JobCode + Email 非空」判定
  - code: portal-manager
    name: 入口網主管專區
    permissions:
      - portal.mgr.rights.read
      - portal.mgr.shift.read
      - portal.mgr.boss-trace.read
      - portal.mgr.attendance.read
      - portal.mgr.leave-balance.read
      - portal.mgr.promotion.read
      - portal.mgr.training.read
      - portal.mgr.safety-course.read
      - portal.mgr.property.read
      - portal.mgr.budget.read
      - portal.mgr.budget-apply.read
  - code: portal-esh-admin
    name: 入口網 ESH 證照管理
    permissions:
      - portal.esh.license.read
      - portal.esh.item.read
      - portal.esh.need.read
      - portal.esh.personal.read
      - portal.esh.manager.read
    # adGroups:
    #   - 'CN=<環安衛群組>,OU=Groups,DC=gsc,DC=com,DC=tw'
  # 以下角色需填入公司 AD 群組 DN 才有成員(DN 含逗號,必須用區塊清單並加引號);未填時角色存在但沒有人
  - code: it-app-user
    name: IT 管理系統使用者
    permissions: [it.app.access]
    # adGroups:
    #   - 'CN=<IT 人員群組>,OU=Groups,DC=gsc,DC=com,DC=tw'
  - code: portal-approver
    name: 入口網簽核主管
    permissions: [bpm.approval.read, bpm.approval.approve, bpm.approval.reject]
    # adGroups:
    #   - 'CN=<主管群組>,OU=Groups,DC=gsc,DC=com,DC=tw'
  - code: portal-editor
    name: 入口網內容維護(人資 / 行政)
    permissions: [portal.news.publish, portal.resource.edit, portal.onboarding.edit]
    # adGroups:
    #   - 'CN=<人資行政群組>,OU=Groups,DC=gsc,DC=com,DC=tw'
