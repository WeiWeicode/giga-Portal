# 測試區 / 正式區 Gateway 的員工入口網權限(Gateway CLI `apply` 格式;docs/TEST-DEPLOY-RUNBOOK 見 Gateway repo)
#
# 與 gateway-dev-rbac.yaml 的差別:沒有本機模擬 AD 群組;需要 AD 群組的角色由 IT 依公司 GN-* 群組填入 DN(Gateway P-08)。
# 測試區與正式區設定不互通(Gateway PRD Q3),兩區各自套用:
#   sh deploy/apply-gateway-rbac.sh test <主機受保護目錄>/test.env
# 權限分類 kind / parent / sort(Gateway PRD §8.3.2,2026-10-01 起支援)依 frontend/src/router.ts 的選單順序,供 GigaItApp 以樹狀設定。
# 暫時做法:portal-api(x-permissions 自動註冊)上線後,權限改由 portal-api 宣告,角色與指派改由 IT 在 GigaItApp 設定(PRD §5.2、§9)。
# 權限代碼以 PRD §6.5 為準,與 gateway-dev-rbac.yaml 保持一致。
# 注意:Gateway CLI 沒有個別指派角色的指令,需要 AD 群組(adGroups)或公司(companies)才會有成員;
#       套用會遞增所有使用者的權限版本(已登入者下一次呼叫 API 時由 web-kit 自動換發,不需重新登入)。
permissions:
  # 應用(kind=app,Gateway PRD §8.3.3)
  - { code: portal.app.access, name: 員工入口網使用權限, kind: app, sort: 10 }
  - { code: it.app.access, name: IT 管理系統使用權限, kind: app, sort: 20 }
  # 選單 / Tab / 按鈕
  - { code: portal.home.read, name: 入口網首頁, kind: menu, parent: portal.app.access, sort: 10 }
  - { code: portal.profile.read, name: 個人資料, kind: menu, parent: portal.app.access, sort: 20 }
  - { code: portal.profile.edit, name: 編輯緊急聯絡人, kind: button, parent: portal.profile.read, sort: 10 }
  - { code: portal.leave.read, name: 我的假期, kind: menu, parent: portal.app.access, sort: 30 }
  - { code: portal.leave-history.read, name: 請假紀錄, kind: tab, parent: portal.leave.read, sort: 10 }
  - { code: portal.leave.apply, name: 請假申請, kind: button, parent: portal.leave.read, sort: 20 }
  - { code: portal.attendance.read, name: 出勤紀錄, kind: menu, parent: portal.app.access, sort: 40 }
  - { code: portal.attendance.punch, name: 線上打卡, kind: button, parent: portal.attendance.read, sort: 10 }
  - { code: portal.form.read, name: 表單下載, kind: menu, parent: portal.app.access, sort: 60 }
  - { code: portal.resource.read, name: 行政資源, kind: menu, parent: portal.app.access, sort: 70 }
  - { code: portal.resource.edit, name: 維護行政資源, kind: menu, parent: portal.resource.read, sort: 10 }
  - { code: portal.onboarding.read, name: 新人導覽, kind: menu, parent: portal.app.access, sort: 80 }
  - { code: portal.onboarding.edit, name: 維護新人導覽, kind: button, parent: portal.onboarding.read, sort: 10 }
  - { code: portal.directory.read, name: 分機表、聯絡窗口, kind: menu, parent: portal.app.access, sort: 90 }
  - { code: portal.gui-number.read, name: 集團統編資訊, kind: menu, parent: portal.app.access, sort: 100 }
  - { code: portal.news.read, name: 公告, kind: menu, parent: portal.app.access, sort: 110 }
  - { code: portal.news.publish, name: 發布公告, kind: button, parent: portal.news.read, sort: 10 }
  - { code: portal.calendar.read, name: 行事曆, kind: menu, parent: portal.app.access, sort: 120 }
  - { code: portal.links.read, name: 集團系統, kind: menu, parent: portal.app.access, sort: 130 }
  - { code: portal.talk.read, name: 3691 全民開講, kind: menu, parent: portal.app.access, sort: 140 }
  # BPM 簽核:BPM 提供 API 後改由 BPM 的 OpenAPI 宣告(PRD Q8)
  - { code: bpm.approval.read, name: 待我簽核, kind: menu, parent: portal.app.access, sort: 50 }
  - { code: bpm.approval.approve, name: 簽核核准, kind: button, parent: bpm.approval.read, sort: 10 }
  - { code: bpm.approval.reject, name: 簽核退回, kind: button, parent: bpm.approval.read, sort: 20 }

roles:
  - code: employee
    name: 員工
    permissions:
      - portal.app.access
      - portal.home.read
      - portal.profile.read
      - portal.profile.edit
      - portal.leave.read
      - portal.leave-history.read
      - portal.leave.apply
      - portal.attendance.read
      - portal.attendance.punch
      - portal.form.read
      - portal.resource.read
      - portal.onboarding.read
      - portal.directory.read
      - portal.gui-number.read
      - portal.news.read
      - portal.calendar.read
      - portal.links.read
      - portal.talk.read
  # 以下角色需填入公司 AD 群組 DN 才有成員(DN 含逗號,必須用區塊清單並加引號);未填時角色存在但沒有人
  - code: it-app-user
    name: IT 管理系統使用者
    permissions: [it.app.access]
    # adGroups:
    #   - 'CN=<IT 人員群組>,OU=Groups,DC=gsc,DC=com,DC=tw'
  - code: portal-approver
    name: 入口網簽核主管
    permissions: [bpm.approval.read, bpm.approval.approve, bpm.approval.reject]
    # adGroups:
    #   - 'CN=<主管群組>,OU=Groups,DC=gsc,DC=com,DC=tw'
  - code: portal-editor
    name: 入口網內容維護(人資 / 行政)
    permissions: [portal.news.publish, portal.resource.edit, portal.onboarding.edit]
    # adGroups:
    #   - 'CN=<人資行政群組>,OU=Groups,DC=gsc,DC=com,DC=tw'
